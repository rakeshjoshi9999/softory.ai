# Copy to .github/workflows/impact.yml (the builder may not edit workflows).
name: impact

on:
  pull_request:
    paths: ['materials/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    runs-on: ubuntu-latest
    env:
      FACTORY_REGISTRY: http://localhost:4873/
    services:
      registry:
        image: verdaccio/verdaccio:6
        ports: ['4873:4873']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: pnpm install --frozen-lockfile
      - name: Throwaway signing key
        run: |
          key="$(openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt)"
          echo "FACTORY_SIGNING_KEY<<EOF" >> "$GITHUB_ENV"; echo "$key" >> "$GITHUB_ENV"; echo "EOF" >> "$GITHUB_ENV"
      - name: Release the base branch's current versions into the registry
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git worktree add ../base "origin/$BASE_REF"
          (cd ../base && pnpm install --frozen-lockfile \
            && pnpm nx run-many -t emit-openapi emit-nest-server emit-angular-client --output-style=static \
            && for m in $(ls materials); do pnpm exec tsx tools/factory/src/cli.ts release "$m"; done) || echo "base release failed; the impact report will skip the dry-run" >&2
      - name: Emit specs
        run: pnpm nx run-many -t emit-openapi emit-nest-server emit-angular-client --output-style=static
      - name: Impact report
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          : > impact.md
          for m in $(git diff --name-only "origin/$BASE_REF"...HEAD -- materials | cut -d/ -f2 | sort -u); do
            pnpm exec tsx tools/factory/src/cli.ts impact "materials/$m" --seed-registry >> impact.md || true
          done
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('impact.md', 'utf8');
            if (!text.trim()) return;
            const body = '<!-- factory-impact -->\n' + text;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith('<!-- factory-impact -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
