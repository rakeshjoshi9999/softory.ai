name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      FIXER_URL: ${{ secrets.FIXER_URL }}
      FIXER_TOKEN: ${{ secrets.FIXER_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        if: hashFiles('package.json') != ''
        run: pnpm install --frozen-lockfile
      - name: Lint, test, build (affected)
        if: hashFiles('nx.json') != ''
        run: pnpm nx affected -t lint test build --base=origin/main --parallel=3 2>&1 | tee ci.log
        shell: bash

      # Incident response: hand the failure to the Claude fixer scheduled task.
      - name: Notify fixer
        if: failure() && env.FIXER_URL != ''
        shell: bash
        run: |
          TAIL=$(tail -n 80 ci.log 2>/dev/null || echo "no log captured")
          TEXT=$(printf 'CI failed.\nRepo: %s\nBranch: %s\nCommit: %s\nRun: %s/%s/actions/runs/%s\n\nLog tail:\n%s' \
            "$GITHUB_REPOSITORY" "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$TAIL")
          jq -n --arg text "$TEXT" '{text: $text}' > payload.json
          curl -sS -X POST "$FIXER_URL" \
            -H "Authorization: Bearer $FIXER_TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            --data @payload.json

  # helm lint + kubeconform for the thin charts (P2-09). Not a required check yet.
  charts:
    runs-on: ubuntu-latest
    continue-on-error: true   # first real helm run; make it blocking once green
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | sudo tar xz -C /usr/local/bin kubeconform
      - run: bash scripts/chart-check.sh

  # First real run of the Dagger pipeline module (P2-01). Informational until it is green;
  # then switch the verify job to `dagger call ci` and drop this job.
  dagger:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Dagger v0.21.11
        run: curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=/usr/local/bin DAGGER_VERSION=0.21.11 sudo -E sh
      - run: dagger call -m pipelines/dagger ci --src=. --base=origin/main
