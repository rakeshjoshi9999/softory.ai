name: impact

on:
  pull_request:
    paths: ['materials/**']

permissions:
  contents: read
  pull-requests: write

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: pnpm install --frozen-lockfile
      - name: Emit specs
        run: pnpm nx run-many -t emit-openapi
      - name: Impact report
        shell: bash
        run: |
          : > impact.md
          for m in $(git diff --name-only origin/${{ github.base_ref }}...HEAD -- materials | cut -d/ -f2 | sort -u); do
            pnpm exec tsx tools/factory/src/cli.ts impact "materials/$m" >> impact.md || true
          done
      - name: Post PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('impact.md', 'utf8');
            if (!text.trim()) return;
            const body = '<!-- factory-impact -->\n' + text;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith('<!-- factory-impact -->'));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
