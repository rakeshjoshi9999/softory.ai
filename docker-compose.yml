services:
  registry:
    image: verdaccio/verdaccio:6
    ports:
      - "4873:4873"
    volumes:
      - ./tools/registry/config.yaml:/verdaccio/conf/config.yaml:ro
      - registry-storage:/verdaccio/storage
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: factory
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  registry-storage:
  postgres-data:
