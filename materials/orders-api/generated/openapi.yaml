openapi: 3.0.0
info:
  title: Orders API
  version: 1.0.0
  description: Create and read customer orders.
tags:
  - name: Orders
paths:
  /orders:
    get:
      operationId: listOrders
      description: List orders, newest first.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum number of orders to return.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
          explode: false
        - name: cursor
          in: query
          required: false
          description: Cursor from a previous page.
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          description: Returned when the request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Orders
    post:
      operationId: createOrder
      description: Create an order.
      parameters: []
      responses:
        '201':
          description: The request has succeeded and a new resource has been created as a result.
          headers:
            location:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: Returned when the request body is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
  /orders/{id}:
    get:
      operationId: getOrder
      description: Get one order by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          description: Returned when an order does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      tags:
        - Orders
components:
  schemas:
    Order:
      type: object
      required:
        - id
        - customerId
        - lines
        - currency
        - status
        - createdAt
      properties:
        id:
          type: string
          description: Unique order id.
          readOnly: true
        customerId:
          type: string
          minLength: 1
          description: Id of the customer who placed the order.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
          minItems: 1
          description: Ordered product lines.
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 currency code.
        status:
          allOf:
            - $ref: '#/components/schemas/OrderStatus'
          description: Current status.
          readOnly: true
        createdAt:
          type: string
          format: date-time
          description: When the order was created.
          readOnly: true
      description: A customer order.
    OrderLine:
      type: object
      required:
        - sku
        - quantity
        - unitPrice
      properties:
        sku:
          type: string
          minLength: 1
          description: Stock-keeping unit of the product.
        quantity:
          type: integer
          format: int32
          minimum: 1
          description: Number of units ordered.
        unitPrice:
          type: integer
          format: int64
          minimum: 0
          description: Price of one unit, in minor currency units (e.g. cents).
      description: One product line within an order.
    OrderPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
          description: Orders on this page.
        nextCursor:
          type: string
          description: Opaque cursor for the next page; absent on the last page.
      description: A page of orders.
    OrderStatus:
      type: string
      enum:
        - pending
        - paid
        - shipped
        - cancelled
      description: Lifecycle state of an order.
    Problem:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code.
        message:
          type: string
          description: Human-readable explanation.
      description: Error body returned for 4xx responses.
servers:
  - url: https://api.example.com
    description: Default server
    variables: {}
